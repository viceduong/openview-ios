<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A: "Aperture" — an O-ring opening onto a remote screen, with a V notch. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0B1230"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE7FF"/>
      <stop offset="0.55" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F7FF"/>
      <stop offset="1" stop-color="#B9D8FF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="92"/>
  <!-- remote screen seen through the ring -->
  <rect x="372" y="402" width="280" height="190" rx="26" fill="url(#screen)"/>
  <rect x="482" y="592" width="60" height="44" fill="url(#screen)"/>
  <rect x="432" y="630" width="160" height="22" rx="11" fill="url(#screen)"/>
  <!-- V chevron on the screen -->
  <path d="M452 452 L512 540 L572 452" fill="none" stroke="#2E49C9" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
