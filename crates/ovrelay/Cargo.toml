[package]
name = "ovrelay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenView relay server: pipes two relay-tunnel carriers together by session id"

[features]
default = []
# Exposes `ovrelay::fuzzing` (parser entry points for the cargo-fuzz targets
# in `fuzz/`).
fuzzing = []

[dependencies]
ovtransport = { path = "../ovtransport" }
ovcommon = { path = "../ovcommon", features = ["logging"] }
thiserror.workspace = true
tracing = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
ovcore = { path = "../ovcore" }

[lints]
workspace = true
