[package]
name = "ovcommon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared plumbing of the OpenView Windows binaries: data directories, the JSON-lines status-event schema, logging setup"

[features]
default = []
# `logging::init` (tracing-subscriber with an EnvFilter). The CLI binaries
# (ovhost, ovview) enable it; the GUI has its own file log.
logging = ["dep:tracing-subscriber"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
