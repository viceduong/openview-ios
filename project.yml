name: OpenView
options:
  bundleIdPrefix: com.openview
  deploymentTarget:
    iOS: "15.6"
  xcodeVersion: "15.0"
  createIntermediateGroups: false
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # Prebuilt Rust staticlib (libs/libovffi.a) + C shim, exposed to Swift
    # through the Objective-C bridging header (OvFFI.swift references the C
    # symbols directly with no `import` — the bridging-header pattern).
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/RemoteView/include"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/RemoteView/include/shim.h"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/libs"
    OTHER_LDFLAGS: "-lovffi"
    # libs/libovffi.a is aarch64-apple-ios-sim only — building the x86_64
    # simulator slice makes the linker ignore the whole archive
    # ("ignoring file ... found architecture 'arm64', required 'x86_64'").
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

targets:
  OpenView:
    type: application
    platform: iOS
    sources:
      - path: RemoteView
    info:
      path: RemoteView/Info.plist
      properties:
        CFBundleDisplayName: OpenView
        CFBundleShortVersionString: "0.28.0"  # keep in sync with the workspace crate version (openview/Cargo.toml)
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: OpenView connects to peers on your local network or to your relay server.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # iPad mouse/trackpad: deliver secondary clicks and scroll as events
        # (RemoteScreenSurface right-click + wheel).
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        NSFaceIDUsageDescription: OpenView uses Face ID to unlock the app and your saved access PINs.
        # Section 3: landscape sessions (iPhone: no upside-down; iPad: all).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Per-controller status bar (the session hides it).
        UIViewControllerBasedStatusBarAppearance: true
        # Section 4: ProMotion iPhones may run the session's display link
        # (pan / zoom / cursor redraws) above 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openview.remoteview
        INFOPLIST_FILE: RemoteView/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "15.6"
        GENERATE_INFOPLIST_FILE: NO
        # Single-size 1024 app icon (RemoteView/Assets.xcassets); Xcode
        # generates every device size from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Blue accent (#0A6CFF light / #3D8BFF dark), RemoteView/Assets.xcassets.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
