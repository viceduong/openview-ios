# cargo-about configuration (https://github.com/EmbarkStudios/cargo-about).
# Used by scripts/package.ps1 when cargo-about is installed:
#   cargo about generate -c packaging/about.toml packaging/about.hbs
# Keep `accepted` in sync with deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "IJG",
    "NCSA",
    "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
no-clearly-defined = true
